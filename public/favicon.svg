<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle luxury embossed depth -->
    <filter id="cacao-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#140a06" flood-opacity="0.6"/>
    </filter>

    <!-- Arc for upper text: FERNANDINA DE JAGUA -->
    <path id="upper-arc" d="M 58,250 A 192,192 0 1,1 442,250" fill="none" />

    <!-- Arc for lower text: CHOCOLATES -->
    <path id="lower-arc" d="M 436,250 A 186,186 0 0,1 64,250" fill="none" />
  </defs>

  <!-- Deep Roasted Cacao Background Circle -->
  <circle cx="250" cy="250" r="248" fill="#382117" />

  <!-- Outer Double Gold Rings -->
  <circle cx="250" cy="250" r="244" fill="none" stroke="#cca35f" stroke-width="5" />
  <circle cx="250" cy="250" r="236" fill="none" stroke="#25140d" stroke-width="3" />
  <circle cx="250" cy="250" r="231" fill="none" stroke="#cca35f" stroke-width="2.5" />

  <!-- Inner Concentric Ring -->
  <circle cx="250" cy="250" r="148" fill="none" stroke="#cca35f" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Curved Text: Top - FERNANDINA DE JAGUA -->
  <text fill="#cca35f" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="5">
    <textPath href="#upper-arc" startOffset="50%" text-anchor="middle">
      FERNANDINA DE JAGUA
    </textPath>
  </text>

  <!-- Left Crown Emblem -->
  <g transform="translate(48, 260) scale(0.7)" filter="url(#cacao-shadow)">
    <!-- Crown base & peaks -->
    <path d="M 0,15 L 6,0 L 15,10 L 24,-2 L 33,10 L 42,0 L 48,15 Z" fill="#cca35f" />
    <!-- Blue Gemstone -->
    <ellipse cx="24" cy="8" rx="3.5" ry="5.5" fill="#a4cbe6" stroke="#cca35f" stroke-width="1" />
  </g>

  <!-- Right Crown Emblem -->
  <g transform="translate(418, 260) scale(0.7)" filter="url(#cacao-shadow)">
    <!-- Crown base & peaks -->
    <path d="M 0,15 L 6,0 L 15,10 L 24,-2 L 33,10 L 42,0 L 48,15 Z" fill="#cca35f" />
    <!-- Blue Gemstone -->
    <ellipse cx="24" cy="8" rx="3.5" ry="5.5" fill="#a4cbe6" stroke="#cca35f" stroke-width="1" />
  </g>

  <!-- Curved Text: Bottom - CHOCOLATES -->
  <text fill="#cca35f" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="600" letter-spacing="14">
    <textPath href="#lower-arc" startOffset="50%" text-anchor="middle">
      CHOCOLATES
    </textPath>
  </text>

  <!-- Central Interlocking Monogram: F D J -->
  <g id="monogram" filter="url(#cacao-shadow)">
    <!-- Letter F -->
    <path d="M 138,158 L 272,158 L 272,198 L 246,198 L 246,178 L 198,178 L 198,226 L 240,226 L 240,248 L 198,248 L 198,300 L 216,300 L 216,322 L 138,322 L 138,300 L 158,300 L 158,178 L 138,178 Z" fill="#cca35f" />

    <!-- Letter D (nested into F's stem) -->
    <path d="M 214,264 L 254,264 C 286,264 300,282 300,305 C 300,328 284,342 254,342 L 214,342 Z M 238,282 L 238,324 L 253,324 C 270,324 278,315 278,303 C 278,291 270,282 253,282 Z" fill="#cca35f" />

    <!-- Letter J (tall sweeping hook extending right and under) -->
    <path d="M 285,134 L 362,134 L 362,154 L 340,154 L 340,286 C 340,332 318,358 252,358 C 238,358 226,355 220,351 L 226,334 C 234,337 244,339 254,339 C 298,339 314,320 314,286 L 314,154 L 285,154 Z" fill="#cca35f" />
  </g>
</svg>
