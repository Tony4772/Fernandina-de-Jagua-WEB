name: Deploy a Firebase Hosting (producción)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build y deploy a producción
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias del backend de pagos
        run: npm --prefix functions ci

      - name: Comprobar que el secreto de Firebase existe
        id: check_secret
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERNANDINA_DE_JAGUA_WEB }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT_FERNANDINA_DE_JAGUA_WEB; se omite el despliegue."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar el sitio
        run: npm run build

      - name: Desplegar en Firebase Hosting
        if: steps.check_secret.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERNANDINA_DE_JAGUA_WEB }}
          projectId: fernandina-de-jagua-web
          channelId: live
